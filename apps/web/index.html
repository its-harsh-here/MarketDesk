<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MarketDesk</title>
    <script>(function(){try{var t=localStorage.getItem("md-theme")||"dark";if(t==="system"){t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");var d=localStorage.getItem("md-density");if(d==="compact"){document.documentElement.setAttribute("data-density","compact")}}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
