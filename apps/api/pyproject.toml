[project]
name = "marketdesk"
version = "0.1.0"
description = "MarketDesk — personal market research terminal (API, worker, CLI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.33",
    "yfinance==1.7.0",
    "pandas==3.1.0",
    "python-dateutil==2.9.0.post0",
    "psycopg[binary]==3.3.7",
    "exchange-calendars==4.13.2",
]

[project.scripts]
marketdesk = "marketdesk.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:marketdesk.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101", "B008", "S311", "UP046", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
