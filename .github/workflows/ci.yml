name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check marketdesk tests
      - run: uv run pytest -q
      - name: Migrations match models
        run: DATABASE_URL=sqlite:///$RUNNER_TEMP/check.db uv run alembic upgrade head && DATABASE_URL=sqlite:///$RUNNER_TEMP/check.db uv run alembic check

  api-postgres:
    name: API on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: marketdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/marketdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Migrations match models on PostgreSQL
        run: DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL uv run alembic check

  web:
    name: Web (types, lint, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: Browser journeys (fixture mode)
    runs-on: ubuntu-24.04
    needs: [api, api-postgres, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv python install 3.13 && uv sync --frozen
        working-directory: apps/api
      - name: OpenAPI types are in sync
        working-directory: apps/web
        run: npm ci && node scripts/gen-api.mjs && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run build
        working-directory: apps/web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketdesk:ci .
