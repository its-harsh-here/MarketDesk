# Render Blueprint — free setup: one Docker web service on Render's Free plan running web + alert worker
# (the image's default command, `python -m marketdesk.serve`), with data in an external free PostgreSQL
# database (e.g. Neon). Free Render services have no persistent disk and their filesystem is wiped on every
# restart, so DATABASE_URL is required to keep your data. Create it from the Render dashboard:
# New → Blueprint → this repository. You will be asked for OWNER_USERNAME, OWNER_PASSWORD_HASH and
# DATABASE_URL; SESSION_SECRET is generated.
services:
  - type: web
    name: marketdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: MARKETDESK_ENV
        value: production
      - key: DATA_PROVIDER
        value: yahoo
      - key: ALERT_POLL_SECONDS
        value: "300"
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
