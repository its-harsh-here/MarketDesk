# MarketDesk personal installation: one-shot migration, web (API + SPA) and the alert worker,
# sharing a persistent SQLite volume. Copy .env.example to .env first.
name: marketdesk

x-app: &app
  image: marketdesk:local
  build:
    context: .
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
  env_file: [.env]
  volumes:
    - marketdesk-data:/data
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["python", "-m", "marketdesk.cli", "migrate"]
    restart: "no"

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Bound to localhost by default; put an HTTPS reverse proxy in front for remote access.
      - "127.0.0.1:${MARKETDESK_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "marketdesk.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "marketdesk.cli", "worker-health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  marketdesk-data:
